name: Build Aurea Diagnostics APK
on:
  workflow_dispatch:
  push:
    paths:
      - "aureadiag/**"
      - "settings.gradle.kts"
      - ".github/workflows/build-aurea-diagnostics.yml"
permissions:
  contents: read
concurrency:
  group: aurea-diagnostics-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build diagnostic APK
        run: gradle --no-daemon :aureadiag:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aurea-diagnostics-apk
          path: aureadiag/build/outputs/apk/debug/aureadiag-debug.apk
          if-no-files-found: error
          retention-days: 14
