name: Build Aurea Native Tester APK
on:
  workflow_dispatch:
  push:
    paths:
      - "aureadiag/**"
      - "apks/Aurea-0.4.7-32bits.apk.gz"
      - "settings.gradle.kts"
      - ".github/workflows/build-aurea-diagnostics.yml"
permissions:
  contents: read
concurrency:
  group: aurea-diagnostics-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Aurea ARM native runtime and bundled fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aurea-extract
          gzip -dc apks/Aurea-0.4.7-32bits.apk.gz > /tmp/aurea-extract/aurea.apk
          mkdir -p aureadiag/src/main/jniLibs/armeabi-v7a aureadiag/src/main/assets
          for lib in libaurea.so libc++_shared.so libxeno_native.so; do
            unzip -p /tmp/aurea-extract/aurea.apk "lib/armeabi-v7a/$lib" > "aureadiag/src/main/jniLibs/armeabi-v7a/$lib"
            test -s "aureadiag/src/main/jniLibs/armeabi-v7a/$lib"
          done
          for font in Roboto-Regular.ttf NotoNaskhArabic-Regular.ttf NotoSansJP-Regular.otf; do
            unzip -p /tmp/aurea-extract/aurea.apk "assets/$font" > "aureadiag/src/main/assets/$font"
            test -s "aureadiag/src/main/assets/$font"
          done
          sha256sum aureadiag/src/main/jniLibs/armeabi-v7a/*.so
          du -h aureadiag/src/main/jniLibs/armeabi-v7a/* aureadiag/src/main/assets/*
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build native tester APK
        run: gradle --no-daemon :aureadiag:assembleDebug
      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK=aureadiag/build/outputs/apk/debug/aureadiag-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a/lib(aurea|c\+\+_shared|xeno_native)\.so'
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: aurea-native-tester-apk
          path: aureadiag/build/outputs/apk/debug/aureadiag-debug.apk
          if-no-files-found: error
          retention-days: 14
