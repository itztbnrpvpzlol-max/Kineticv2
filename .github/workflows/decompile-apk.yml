name: Decompile APK

on:
  workflow_dispatch:
    inputs:
      input_path:
        description: "Path to an APK or ZIP containing an APK"
        required: true
        default: "input/base.zip"
        type: string

permissions:
  contents: read

concurrency:
  group: decompile-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decompile:
    name: Decompile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate APK input
        id: apk
        shell: bash
        env:
          APK_PATH_INPUT: ${{ inputs.input_path }}
        run: |
          set -euo pipefail
          input_path="${APK_PATH_INPUT}"
          if [[ -z "$input_path" || "$input_path" = /* || "$input_path" == *".."* ]]; then
            echo "::error::Use a repository-relative APK or ZIP path without '..'."
            exit 1
          fi
          if [[ ! -f "$input_path" ]]; then
            echo "::error file=$input_path::Input file not found."
            exit 1
          fi

          mkdir -p decompiled extracted
          case "$input_path" in
            *.zip|*.ZIP)
              unzip -q "$input_path" -d extracted
              mapfile -d '' apks < <(find extracted -type f -iname '*.apk' -print0 | sort -z)
              if [[ "${#apks[@]}" -eq 0 ]]; then
                echo "::error::No APK files were found inside the ZIP."
                exit 1
              fi
              if [[ "${#apks[@]}" -gt 1 ]]; then
                printf 'Found multiple APKs:\n'
                printf ' - %s\n' "${apks[@]}"
                echo "::error::ZIP contains multiple APKs. Please upload a ZIP with one APK."
                exit 1
              fi
              apk_path="${apks[0]}"
              ;;
            *.apk.gz|*.APK.GZ)
              apk_path="extracted/$(basename "${input_path%.gz}")"
              gzip -dc "$input_path" > "$apk_path"
              ;;
            *.apk|*.APK)
              apk_path="$input_path"
              ;;
            *)
              echo "::error::Input must be an .apk or .zip file."
              exit 1
              ;;
          esac

          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "Input: $input_path" >> "$GITHUB_STEP_SUMMARY"
          echo "APK selected: $apk_path" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$apk_path" | tee decompiled/apk-sha256.txt

      - name: Download JADX
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip" \
            --output /tmp/jadx.zip
          mkdir -p /opt/jadx
          unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx

      - name: Decompile code with JADX
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p decompiled/jadx
          set +e
          /opt/jadx/bin/jadx \
            --show-bad-code \
            --deobf \
            -d decompiled/jadx \
            "$APK_PATH" 2>&1 | tee decompiled/jadx/jadx.log
          jadx_status=${PIPESTATUS[0]}
          set -e
          if [[ "$jadx_status" -ne 0 ]]; then
            echo "::warning::JADX reported recoverable decompilation errors (exit $jadx_status). Keeping partial output and continuing with Apktool."
            echo "JADX exit code: $jadx_status (partial output retained; inspect jadx/jadx.log)." > decompiled/jadx/DECOMPILATION-WARNING.txt
          fi
          if [[ -z "$(find decompiled/jadx -type f -name '*.java' -print -quit)" ]]; then
            echo "::error::JADX produced no Java source files."
            exit 1
          fi

      - name: Decode resources and smali with Apktool
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar" \
            --output /tmp/apktool.jar
          java -jar /tmp/apktool.jar d \
            --force \
            --output decompiled/apktool \
            "$APK_PATH"

      - name: Write output guide
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          cat > decompiled/README.txt <<'EOF'
          Kinetic APK decompilation results

          jadx/
            Decompiled Java-like source reconstructed from DEX bytecode.
            This is not the original Kotlin source and may not rebuild as-is.

          apktool/
            Decoded AndroidManifest.xml, resources, assets (when present),
            and smali disassembly.

          apk-sha256.txt
            SHA-256 checksum of the input APK.

          This is static analysis only. The APK was not installed or executed.
          Only decompile APKs you own or are authorized to analyze.
          EOF
          {
            echo "## Decompilation complete"
            echo ""
            echo "- Input: \"$APK_PATH\""
            echo "- JADX output: `decompiled/jadx/`"
            echo "- Apktool output: `decompiled/apktool/`"
            echo ""
            echo "Download the **apk-decompiled-output** artifact below this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload decompiled output
        uses: actions/upload-artifact@v4
        with:
          name: apk-decompiled-output
          path: decompiled/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
