name: Build Aurea GLES shader patch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurea-gles-patch
  cancel-in-progress: false

jobs:
  build:
    name: Gradle APK rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install zipalign and apksigner
        run: |
          set -eu
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Build with Gradle
        run: gradle --no-daemon clean buildPatchedApk

      - name: Inspect APK package metadata
        run: |
          set -euo pipefail
          aapt dump badging build/outputs/apk/Aurea-0.4.7-GLES-patched.apk | head -n 8
          unzip -t build/outputs/apk/Aurea-0.4.7-GLES-patched.apk | tail -n 2
          unzip -lv build/outputs/apk/Aurea-0.4.7-GLES-patched.apk | awk '$NF ~ /^lib\/.*\.so$/ && $2 != "Stored" { print "Compressed native library: " $NF; bad=1 } END { exit bad }'

      - name: Write build summary
        run: |
          {
            echo "## Aurea GLES Gradle rebuild"
            echo ""
            echo "- Gradle 8.7 runs the build task."
            echo "- Apktool decodes and rebuilds the original APK resources and manifest."
            echo "- Patched 290 embedded shader headers in libaurea.so."
            echo "- Native libraries are stored uncompressed; APK is zip-aligned and signed."
            echo ""
            echo "**Note:** The build uses a newly generated signing key. It cannot update an install signed with Aurea's original private key."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: aurea-gles-gradle-apk
          path: |
            build/outputs/apk/Aurea-0.4.7-GLES-patched.apk
            build/outputs/apk/apk-sha256.txt
            build/outputs/apk/patched-libaurea-sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
